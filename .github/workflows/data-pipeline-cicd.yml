name: Data Pipeline CI/CD

# Workflow environment configuration
env:
  PYTHON_VERSION: '3.9'
  PIPELINE_VERSION: '1.0'
  ENVIRONMENT: 'simulation'

### PRACTICE CHALLENGE 1 ###
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'README*'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'README*'
      - 'docs/**'

jobs:
  # PROVIDED CODE - DO NOT MODIFY
  test:
    name: Run Comprehensive Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Create simulated project files
        run: |
          # Create simulated pipeline configuration
          mkdir -p tests/
          echo "version: '1.0'" > pipeline-config.yml
          echo "pipeline:" >> pipeline-config.yml
          echo "  name: customer-analytics" >> pipeline-config.yml
          echo "  source: database" >> pipeline-config.yml
          echo "  destination: warehouse" >> pipeline-config.yml
          echo "  transformation:" >> pipeline-config.yml
          echo "    - clean_data" >> pipeline-config.yml
          echo "    - aggregate_metrics" >> pipeline-config.yml
          echo "    - export_results" >> pipeline-config.yml

          # Create simulated requirements.txt
          echo "pandas>=1.3.0" > requirements.txt
          echo "numpy>=1.20.0" >> requirements.txt
          echo "pyyaml>=5.4.0" >> requirements.txt
          echo "pytest>=6.2.0" >> requirements.txt
          echo "requests>=2.25.0" >> requirements.txt

          # Create simulated test file
          echo "import pytest" > tests/test_pipeline.py
          echo "import yaml" >> tests/test_pipeline.py
          echo "" >> tests/test_pipeline.py
          echo "def test_pipeline_config_exists():" >> tests/test_pipeline.py
          echo "    with open('pipeline-config.yml', 'r') as f:" >> tests/test_pipeline.py
          echo "        config = yaml.safe_load(f)" >> tests/test_pipeline.py
          echo "        assert config['version'] == '1.0'" >> tests/test_pipeline.py
          echo "" >> tests/test_pipeline.py
          echo "def test_pipeline_structure():" >> tests/test_pipeline.py
          echo "    assert True  # Simulated test" >> tests/test_pipeline.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas numpy pyyaml requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          echo "✅ Dependencies installed successfully"

      - name: Run unit tests
        run: |
          echo "🧪 Running comprehensive test suite..."
          pytest tests/ -v --tb=short || echo "Tests completed with simulated results"
          echo "✅ All unit tests passed successfully"

      - name: Validate pipeline configuration
        run: |
          echo "🔍 Validating pipeline configuration..."
          python -c "import yaml; config = yaml.safe_load(open('pipeline-config.yml')); print(f'Pipeline: {config[\"pipeline\"][\"name\"]}')"
          echo "✅ Pipeline configuration is valid"

      - name: Code quality checks
        run: |
          echo "🔍 Running code quality checks..."
          echo "  ├── Linting check: ✅ PASSED"
          echo "  ├── Security scan: ✅ PASSED"
          echo "  ├── Dependency audit: ✅ PASSED"
          echo "  └── Code coverage: ✅ 95% coverage"
          echo "✅ All quality checks completed successfully"

  ### PRACTICE CHALLENGE 2 ###
  build:
    name: Build and Package Artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create simulated Dockerfile
        run: |
          cat << 'EOF' > Dockerfile
          FROM python:3.9-slim

          WORKDIR /app

          RUN apt-get update && apt-get install -y \
              gcc \
              && rm -rf /var/lib/apt/lists/*

          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt

          COPY . .

          RUN useradd -m -u 1000 pipeline && chown -R pipeline:pipeline /app
          USER pipeline

          EXPOSE 8080
          CMD ["python", "app.py"]
          EOF

          cat << 'EOF' > app.py
          #!/usr/bin/env python3
          import time
          import yaml
          import pandas as pd

          def run_pipeline():
              print("🚀 Starting data pipeline application...")
              with open('pipeline-config.yml', 'r') as f:
                  config = yaml.safe_load(f)
              print(f"📊 Running pipeline: {config['pipeline']['name']}")
              time.sleep(2)
              print("✅ Data pipeline completed successfully")

          if __name__ == "__main__":
              run_pipeline()
          EOF

          echo "✅ Application files created successfully"

      - name: Validate Docker configuration
        run: |
          echo "🐳 Validating Docker configuration..."
          if [ ! -f Dockerfile ]; then
            echo "❌ Dockerfile not found"
            exit 1
          fi

          if grep -q "FROM python:" Dockerfile; then
            echo "✅ Base image specified correctly"
          else
            echo "❌ Invalid base image"
            exit 1
          fi

          if grep -q "WORKDIR /app" Dockerfile; then
            echo "✅ Working directory configured"
          else
            echo "❌ Working directory not set"
            exit 1
          fi

          echo "✅ Docker configuration validation completed"

      - name: Simulate Docker build and tag artifacts
        run: |
          echo "🔨 Simulating multi-platform Docker build (linux/amd64, linux/arm64)..."
          mkdir -p build-artifacts
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # Simula a criação de imagem e manifesto de tags
          echo "IMAGE_TAG=${{ github.sha }}" >> build-artifacts/metadata.txt
          echo "IMAGE_VERSION=${{ env.PIPELINE_VERSION }}" >> build-artifacts/metadata.txt
          echo "BUILD_TIMESTAMP=${BUILD_DATE}" >> build-artifacts/metadata.txt
          echo "LATEST_TAG=latest" >> build-artifacts/metadata.txt
          
          # Cria artefato representativo da imagem compilada
          tar -czf build-artifacts/pipeline-image.tar.gz Dockerfile app.py

          echo "✅ Artifacts generated with tags: ${{ github.sha }} and 'latest'"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-build-artifacts
          path: build-artifacts/
          retention-days: 1
  
  ### PRACTICE CHALLENGE 3 ###
  deploy:
    name: Deploy to Production (Simulated)
    runs-on: ubuntu-latest
    needs: [test, build]
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: pipeline-build-artifacts
          path: deploy-artifacts

      - name: Validate deployment prerequisites and artifacts
        run: |
          echo "🔍 Validating downloaded artifacts..."
          ls -la deploy-artifacts/
          if [ ! -f deploy-artifacts/metadata.txt ] || [ ! -f deploy-artifacts/pipeline-image.tar.gz ]; then
            echo "❌ Missing build artifacts"
            exit 1
          fi
          cat deploy-artifacts/metadata.txt
          echo "✅ Artifact integrity verified"

      - name: Simulate production deployment
        run: |
          echo "🚀 Initiating rolling update to production environment..."
          sleep 2
          echo "📦 Extracting package and deploying container..."
          tar -xzf deploy-artifacts/pipeline-image.tar.gz -C deploy-artifacts/
          cd deploy-artifacts && python3 -c "import app; print('Application boot check: OK')"
          echo "✅ Deployment rollout successful"

      - name: Run comprehensive health checks
        run: |
          echo "🏥 Running production health checks..."
          echo "  ├── Container status: Running (HTTP 200)"
          echo "  ├── Database connectivity: Established"
          echo "  ├── Application latency: < 50ms"
          echo "  └── Memory utilization: Healthy (24%)"
          echo "✅ All health checks passed"

      - name: Rollback simulation
        if: failure()
        run: |
          echo "🚨 CRITICAL ERROR DETECTED DURING DEPLOYMENT OR HEALTH CHECK"
          echo "⏮️ Triggering automatic rollback to previous stable release..."
          sleep 2
          echo "✅ Rollback executed successfully. Traffic redirected."

      - name: Deployment Summary
        if: always()
        run: |
          echo ""
          echo "🎉 DEPLOYMENT COMPLETED SUCCESSFULLY! 🎉"
          echo "================================================="
          echo "🚀 Production deployment completed successfully"
          echo "📦 Artifact Version: ${{ env.PIPELINE_VERSION }}-${{ github.sha }}"
          echo "🔍 Commit SHA: ${{ github.sha }}"
          echo "👤 Deployed by: ${{ github.actor }}"
          echo "⏰ Deployment Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "🌍 Environment: production"
          echo "================================================="
          echo ""
          echo "📊 Key Metrics:"
          echo "  ├── Build Duration: ~2 minutes"
          echo "  ├── Deployment Duration: ~3 minutes"
          echo "  ├── Health Check Status: All systems operational"
          echo "  ├── Performance Validation: Within acceptable thresholds"
          echo "  └── Rollback Capability: ✅ Enabled and tested"
